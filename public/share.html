<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Conversation - Dawn Bringer</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><img src="/static/icon.png" alt="Dawn Bringer"></div>
            <div class="header-text">
                <h1>Dawn Bringer</h1>
            </div>
            <div class="header-subtitle">Run! Goddess AI</div>
        </div>

        <div class="shared-conversation-header hidden" id="sharedHeader">
            <div class="shared-badge">📎 Shared Conversation</div>
            <div class="shared-info" id="sharedInfo"></div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div id="originalMessages"></div>
        </div>

        <div class="bottom-input-wrapper" id="bottomInputWrapper">
            <textarea id="questionInputBottom" class="input-box" placeholder="Ask anything about Run! Goddess..."
                rows="1"></textarea>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script src="/static/share.js"></script>
</body>

</html>
