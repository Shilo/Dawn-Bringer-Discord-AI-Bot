<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ Dawn Bringer - Run! Goddess AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">☀️</div>
            <div class="header-content">
                <h1>Dawn Bringer</h1>
                <p>Run! Goddess AI Assistant</p>
            </div>
            <div class="stats" id="stats">Loading...</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>☀️ Welcome, Survivor!</h2>
                <p>I'm Dawn Bringer, your AI assistant for Run! Goddess.</p>
                <p>Ask me anything about the game—classes, builds, strategies, and more!</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="questionInput" class="input-box" placeholder="Ask a question about Run! Goddess..."
                    rows="1"></textarea>
                <button id="sendButton" class="send-button">Send</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
