<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn Bringer - Run! Goddess AI</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- Open Graph / Discord Preview Meta Tags -->
    <meta property="og:title" content="Dawn Bringer - Run! Goddess AI">
    <meta property="og:description" content="Ask anything about Run! Goddess - Your AI companion for the game world">
    <meta property="og:image" content="/static/icon.png">
    <meta property="og:url" content="/">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dawn Bringer - Run! Goddess AI">
    <meta name="twitter:description" content="Ask anything about Run! Goddess - Your AI companion for the game world">
    <meta name="twitter:image" content="/static/icon.png">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><img src="/static/icon.png" alt="Dawn Bringer"></div>
            <div class="header-text">
                <h1>Dawn Bringer</h1>
                <span class="header-subtitle">Run! Goddess AI</span>
            </div>
            <a id="newChatLink" class="header-button" href="/" onclick="return handleNewChat()" title="Start New Chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M20 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>
        </div>

        <div class="shared-conversation-header hidden" id="sharedHeader">
            <div class="shared-badge">📎 Shared Conversation</div>
            <div class="shared-info" id="sharedInfo"></div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="original-messages" id="originalMessages"></div>
            <div class="welcome-message" id="welcomeMessage">
                <img src="/static/icon.png" alt="Dawn Bringer" class="welcome-icon">
                <div class="stats" id="stats">Loading...</div>
                <h2>How can I help, Survivor?</h2>
            </div>
            <div class="centered-input-wrapper" id="centeredInputWrapper">
                <textarea id="questionInput" class="input-box" placeholder="Ask anything about Run! Goddess..."
                    rows="3"></textarea>
            </div>
        </div>

        <div class="bottom-input-wrapper" id="bottomInputWrapper">
            <textarea id="questionInputBottom" class="input-box" placeholder="Ask anything about Run! Goddess..."
                rows="1"></textarea>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
