        <div class="shared-conversation-header hidden" id="sharedHeader">
            <div class="shared-badge">📎 Shared Conversation</div>
            <div class="shared-info" id="sharedInfo"></div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="original-messages" id="originalMessages"></div>
        </div>

        <div class="welcome-container" id="welcomeContainer">
            <div class="welcome-message">
                <img src="/static/icon.png" alt="Run! Goddess AI" class="welcome-icon">
                <div class="stats" id="stats">Loading...</div>
                <h2>How can I help?</h2>
            </div>
            <textarea id="questionInput" class="input-box" placeholder="Ask anything about Run! Goddess..."
                rows="3"></textarea>
        </div>

        <div class="bottom-input-wrapper" id="bottomInputWrapper">
            <textarea id="questionInputBottom" class="input-box" placeholder="Ask anything about Run! Goddess..."
                rows="1"></textarea>
        </div>
